<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16131d">
    <title>Indifference</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
            background: #16131d;
            color: #f3edf6;
        }

        body {
            box-sizing: border-box;
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            place-items: center;
        }

        main {
            width: min(100%, 960px);
            text-align: center;
        }

        h1 {
            margin: 0 0 0.5rem;
        }

        p {
            margin: 0.5rem 0 1rem;
            color: #c8bdcf;
            line-height: 1.6;
        }

        canvas {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid #554b60;
            background: #000;
            image-rendering: pixelated;
        }

        .controls {
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Indifference</h1>
        <p class="controls">
            Arrow keys to move · Hold Shift to sprint · Z to interact · W to skip dialogue · S to skip credits
        </p>
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
        <p>Click the game if the keyboard controls are not responding.</p>
    </main>
    {{{ SCRIPT }}}
</body>
</html>
